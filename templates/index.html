<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Assistant</title>



<link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">


</head>

<body>

<div class="container">


<h1> AI Study Assistant</h1>
    <p class="subtitle">
        Upload notes and generate quizzes, flashcards, and AI feedback instantly.
    </p>




<form action="/upload"
      method="POST"
      enctype="multipart/form-data">

    <div class="card">

        <h2>Start Learning</h2>

        <input type="file"
       name="pdf"
       accept=".pdf,application/pdf"
       required>

        <div class="primary-actions">

            <button class="green"
                    type="submit"
                    name="action"
                    value="quiz">

                Generate Quiz

            </button>

            <button class="green"
                    type="submit"
                    name="action"
                    value="flashcards">

                Generate Flashcards

            </button>



        </div>

    </div>

</form>


<div class="card">

    <h2> Your Progress</h2>

    <a class="btn" href="/history">
        View My Progress
    </a>

    <a class="btn" href="/dashboard">
        View Dashboard
    </a>

    <a href="/logout">
        <button type="button">Logout</button>
    </a>

</div>

<div id="loading" style="display:none;">
    <p>Generating study materials...</p>
</div>


</div>

<script>

document.querySelector("form").addEventListener(
    "submit",
    function() {
        document.getElementById("loading").style.display = "block";
    }
);

</script>

</body>
</html>
