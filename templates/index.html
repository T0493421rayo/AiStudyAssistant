<!DOCTYPE html>
<html>
<head>
    <title>AI Study Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">
    <h1>AI Study Assistant</h1>
    <div class="card">
        <p>Upload your PDF notes to generate quiz questions or flashcards instantly.</p>
        <form action="/upload" method="POST" enctype="multipart/form-data" onsubmit="showLoading()">

            <input type="file" name="pdf" required>

            <button type="submit" name="action" value="quiz">
                Generate Quiz
            </button>

            <button type="submit" name="action" value="flashcards">
                Generate Flashcards
            </button>

        </form>
        <div id="loading" style="display:none;">
            <p>Generating study materials...</p>
        </div>

    </div>

</div>
<script>
function showLoading() {
    document.getElementById("loading").style.display = "block";
}
</script>
</body>
</html>
