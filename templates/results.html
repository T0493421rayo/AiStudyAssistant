<!DOCTYPE html>
<html>
<head>
    <title>Results</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Your Results</h1>
    <a href="/download/txt">
    <button>Download TXT version</button>
    </a>

    <div class="card">

        <div class="flashcard-container">

            {% set blocks = questions.split('\n\n') %}

            {% for block in blocks %}
                <div class="flashcard">
                    <div class="flashcard-content">
                        {{ block }}
                </div>
                </div>
            {% endfor %}

        </div>

    </div>

    <br>
    <a href="/">⬅ Back</a>

</div>

</body>
</html>
